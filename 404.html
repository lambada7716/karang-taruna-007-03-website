<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Halaman Tidak Ditemukan</title>
  <style>
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f7a8b 0%, #0a5d6d 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: white;
    }

    .container {
      text-align: center;
      max-width: 600px;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    a {
      display: inline-block;
      padding: 12px 24px;
      background: #f4b942;
      color: #1a1b1f;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s;
    }

    a:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Halaman yang Anda cari tidak ditemukan.</p>
    <a href="/">Kembali ke Beranda</a>
  </div>
</body>
</html>
